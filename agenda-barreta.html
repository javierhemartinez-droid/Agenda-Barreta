<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Barreta Producciones</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;700&display=swap');

  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#080812;--bg2:#0d0d1a;--bg3:#1a1a2e;
    --border:#2d2d4e;--accent:#7c3aed;--accent2:#a78bfa;
    --text:#e2e8f0;--muted:#94a3b8;--dim:#555;
    --green:#22c55e;--yellow:#eab308;--red:#ef4444;--gold:#f59e0b;
  }
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh}

  /* HEADER */
  .header{background:linear-gradient(135deg,#0d0b1e,#1a0a3e);border-bottom:1px solid var(--border);padding:16px 20px 0;position:sticky;top:0;z-index:50}
  .header-top{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
  .header-top h1{font-family:'Playfair Display',serif;font-size:22px;letter-spacing:-1px}
  .header-top span{color:var(--accent2);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
  .tabs{display:flex}
  .tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--dim);font-weight:700;font-size:13px;padding:8px 4px 12px;cursor:pointer;transition:all .2s;letter-spacing:.5px;font-family:inherit}
  .tab.active{border-bottom-color:var(--accent2);color:var(--accent2)}

  /* CONTENT */
  .content{max-width:680px;margin:0 auto;padding:24px 16px 80px}
  .screen{display:none}.screen.active{display:block}

  /* SECTION HEADER */
  .sec-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .sec-title{font-family:'Playfair Display',serif;font-size:22px}

  /* BUTTONS */
  .btn{border:none;border-radius:10px;padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:opacity .15s}
  .btn:hover{opacity:.85}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-danger{background:#1a0a0a;color:var(--red);border:1px solid #ef444444}
  .btn-full{width:100%;padding:12px;font-size:15px;margin-top:4px}

  /* CARDS */
  .card{border-radius:12px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
  .card-event-confirmed{background:#0d1f1a;border:1px solid #166534}
  .card-event-tentative{background:#1a1508;border:1px solid #713f12}
  .card-contact{background:var(--bg2);border:1px solid var(--border)}
  .card-contact:hover{border-color:var(--accent)}
  .card-review{background:var(--bg2);border-left:3px solid}

  .card-row{display:flex;justify-content:space-between;align-items:flex-start}
  .card-title{font-family:'Playfair Display',serif;font-size:15px;font-weight:700}
  .card-sub{color:var(--muted);font-size:13px;margin-top:2px}
  .card-note{color:var(--dim);font-size:12px;margin-top:4px;font-style:italic}

  /* BADGES */
  .badge{font-size:11px;font-weight:700;letter-spacing:1px;padding:3px 10px;border-radius:20px}
  .badge-confirmed{background:#166534;color:#86efac}
  .badge-tentative{background:#713f12;color:#fde68a}
  .badge-type{background:var(--bg3);color:var(--accent2);border:1px solid #a78bfa44}
  .badge-green{background:#22c55e22;color:var(--green);border:1px solid #22c55e44}
  .badge-yellow{background:#eab30822;color:var(--yellow);border:1px solid #eab30844}
  .badge-red{background:#ef444422;color:var(--red);border:1px solid #ef444444}

  /* TAGS */
  .tag{background:var(--bg3);color:var(--accent2);border:1px solid #a78bfa44;border-radius:20px;padding:2px 8px;font-size:11px;font-weight:600;letter-spacing:.5px}
  .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}

  /* STARS */
  .stars{display:flex;gap:2px}
  .star{font-size:16px;cursor:pointer;transition:color .15s}
  .star.on{color:var(--gold)}.star.off{color:#444}

  /* FILTER BUTTONS */
  .filters{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .fbtn{background:var(--bg3);color:var(--dim);border:1px solid var(--border);border-radius:20px;padding:5px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:.5px;transition:all .15s}
  .fbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  /* SEMAFORO STATS */
  .semaStats{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .semaStat{flex:1;min-width:90px;background:var(--bg2);border-radius:12px;padding:12px 10px;text-align:center}
  .semaStat .emoji{font-size:22px}
  .semaStat .num{font-weight:800;font-size:22px}
  .semaStat .lbl{color:var(--dim);font-size:11px;font-weight:600;letter-spacing:1px;text-transform:uppercase}

  /* MODAL */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
  .overlay.open{display:flex}
  .modal{background:#0f0f1a;border:1px solid var(--border);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;padding:28px}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
  .modal-title{font-family:'Playfair Display',serif;font-size:18px}
  .modal-close{background:none;border:none;color:#888;font-size:22px;cursor:pointer}

  /* FORM */
  .field{margin-bottom:14px}
  .field label{color:#888;font-size:12px;font-weight:700;letter-spacing:1px;text-transform:uppercase;display:block;margin-bottom:4px}
  .input{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 12px;font-size:14px;outline:none;font-family:inherit}
  .input:focus{border-color:var(--accent)}
  textarea.input{min-height:60px;resize:vertical}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* TRAFFIC BUTTONS */
  .trafBtns{display:flex;gap:8px}
  .trafBtn{flex:1;background:var(--bg3);border:2px solid var(--border);border-radius:10px;padding:10px 6px;cursor:pointer;font-weight:700;font-size:13px;transition:all .15s;font-family:inherit;text-align:center}

  /* SEARCH */
  .search{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:10px 14px;font-size:14px;outline:none;font-family:inherit;margin-bottom:12px}
  .search:focus{border-color:var(--accent)}

  /* MISC */
  .empty{color:var(--dim);text-align:center;padding:40px 0;font-size:14px}
  .del-btn{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;padding:0}
  .section-label{color:var(--dim);font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin:24px 0 10px}
  .detail-row{color:var(--muted);font-size:14px;margin-bottom:8px}
  .detail-row a{color:var(--accent2)}
  .detail-note{background:var(--bg3);border-radius:8px;padding:10px 14px;color:var(--muted);font-size:13px;font-style:italic;margin-bottom:16px}
  .rev-header{color:#888;font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
  .rev-card{background:#0a0a14;border:1px solid var(--border);border-radius:8px;padding:10px 14px;margin-bottom:8px}
  .rev-meta{display:flex;justify-content:space-between;margin-bottom:4px}
  .rev-author{color:var(--dim);font-size:12px}
  .loading{color:var(--accent2);text-align:center;padding:60px 0;font-size:16px;font-family:'Playfair Display',serif}
  .contact-header-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
</style>
</head>
<body>

<div class="header">
  <div class="header-top">
    <h1>🎸 Barreta</h1>
    <span>Producciones</span>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="setTab(0)">📅 Agenda</button>
    <button class="tab" onclick="setTab(1)">📒 Directorio</button>
    <button class="tab" onclick="setTab(2)">🚦 Semáforo</button>
  </div>
</div>

<div class="content">
  <div id="loadingMsg" class="loading">Conectando…</div>

  <!-- SCREEN 1: AGENDA -->
  <div id="screen0" class="screen" style="display:none">
    <div class="sec-header">
      <h2 class="sec-title">Próximos Shows</h2>
      <button class="btn btn-primary" onclick="openModal('modalEvent')">+ Agregar</button>
    </div>
    <div id="eventsUpcoming"></div>
    <div id="eventsPastLabel" class="section-label" style="display:none">Historial</div>
    <div id="eventsPast"></div>
  </div>

  <!-- SCREEN 2: DIRECTORIO -->
  <div id="screen1" class="screen" style="display:none">
    <div class="sec-header">
      <h2 class="sec-title">Directorio</h2>
      <button class="btn btn-primary" onclick="openModal('modalContact')">+ Agregar</button>
    </div>
    <input class="search" id="searchInput" placeholder="🔍  Buscar por nombre, etiqueta..." oninput="renderContacts()">
    <div class="filters" id="contactFilters">
      <button class="fbtn active" data-filter="all" onclick="setFilter(this,'all')">Todos</button>
      <button class="fbtn" data-filter="band" onclick="setFilter(this,'band')">Bandas</button>
      <button class="fbtn" data-filter="provider" onclick="setFilter(this,'provider')">Proveedores</button>
      <button class="fbtn" data-filter="venue" onclick="setFilter(this,'venue')">Locales</button>
    </div>
    <div id="contactsList"></div>
  </div>

  <!-- SCREEN 3: SEMAFORO -->
  <div id="screen2" class="screen" style="display:none">
    <div class="sec-header">
      <h2 class="sec-title">El Semáforo</h2>
      <button class="btn btn-primary" onclick="openModal('modalReview')">+ Reseña</button>
    </div>
    <div class="semaStats">
      <div class="semaStat" style="border:1px solid #22c55e44">
        <div class="emoji">🟢</div>
        <div class="num" style="color:var(--green)" id="statGreen">0</div>
        <div class="lbl">Todo OK</div>
      </div>
      <div class="semaStat" style="border:1px solid #eab30844">
        <div class="emoji">🟡</div>
        <div class="num" style="color:var(--yellow)" id="statYellow">0</div>
        <div class="lbl">Regular</div>
      </div>
      <div class="semaStat" style="border:1px solid #ef444444">
        <div class="emoji">🔴</div>
        <div class="num" style="color:var(--red)" id="statRed">0</div>
        <div class="lbl">Problemas</div>
      </div>
    </div>
    <div id="reviewsList"></div>
  </div>
</div>

<!-- MODAL: EVENTO -->
<div class="overlay" id="modalEvent" onclick="overlayClose(event,'modalEvent')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalEventTitle">Nuevo Evento</span>
      <button class="modal-close" onclick="closeModal('modalEvent')">×</button>
    </div>
    <div class="field"><label>Nombre del show</label><input class="input" id="evTitle" placeholder="Ej: Noche de Blues"></div>
    <div class="field"><label>Local / Venue</label><input class="input" id="evVenue" placeholder="Ej: La Trastienda"></div>
    <div class="grid2">
      <div class="field"><label>Fecha</label><input type="date" class="input" id="evDate"></div>
      <div class="field"><label>Hora</label><input type="time" class="input" id="evTime"></div>
    </div>
    <div class="field"><label>Estado</label>
      <select class="input" id="evStatus">
        <option value="confirmed">Confirmado</option>
        <option value="tentative">Tentativo</option>
      </select>
    </div>
    <div class="field"><label>Notas</label><textarea class="input" id="evNotes" placeholder="Requerimientos, recordatorios..."></textarea></div>
    <button class="btn btn-primary btn-full" onclick="saveEvent()">Guardar Evento</button>
  </div>
</div>

<!-- MODAL: CONTACTO -->
<div class="overlay" id="modalContact" onclick="overlayClose(event,'modalContact')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalContactTitle">Nuevo Contacto</span>
      <button class="modal-close" onclick="closeModal('modalContact')">×</button>
    </div>
    <div class="field"><label>Tipo</label>
      <select class="input" id="coType">
        <option value="band">Banda</option>
        <option value="provider">Proveedor</option>
        <option value="venue">Local / Bar</option>
      </select>
    </div>
    <div class="field"><label>Nombre</label><input class="input" id="coName" placeholder="Nombre de la banda / empresa / local"></div>
    <div class="field"><label>Contacto (persona)</label><input class="input" id="coContact" placeholder="Ej: Martín"></div>
    <div class="grid2">
      <div class="field"><label>Teléfono</label><input class="input" id="coPhone" placeholder="+54 9..."></div>
      <div class="field"><label>Redes / IG</label><input class="input" id="coSocial" placeholder="@handle"></div>
    </div>
    <div class="field"><label>Etiquetas (separadas por coma)</label><input class="input" id="coTags" placeholder="rock, sonido, bar"></div>
    <div class="field"><label>Calificación</label><div class="stars" id="coStarsInput"></div></div>
    <div class="field"><label>Notas</label><textarea class="input" id="coNotes" placeholder="Observaciones importantes..."></textarea></div>
    <button class="btn btn-primary btn-full" onclick="saveContact()">Guardar Contacto</button>
  </div>
</div>

<!-- MODAL: DETALLE CONTACTO -->
<div class="overlay" id="modalDetail" onclick="overlayClose(event,'modalDetail')">
  <div class="modal" id="modalDetailContent"></div>
</div>

<!-- MODAL: RESEÑA -->
<div class="overlay" id="modalReview" onclick="overlayClose(event,'modalReview')">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title">Nueva Reseña</span>
      <button class="modal-close" onclick="closeModal('modalReview')">×</button>
    </div>
    <div class="field"><label>Contacto</label>
      <select class="input" id="rvContact"><option value="">Seleccionar...</option></select>
    </div>
    <div class="field"><label>Tu nombre (socio)</label><input class="input" id="rvAuthor" placeholder="Ej: Javier"></div>
    <div class="field"><label>Semáforo</label>
      <div class="trafBtns">
        <button class="trafBtn" id="tbGreen" onclick="setTraffic('green')" style="color:var(--green)">🟢<br><span style="font-size:11px">Todo OK</span></button>
        <button class="trafBtn" id="tbYellow" onclick="setTraffic('yellow')" style="color:var(--yellow)">🟡<br><span style="font-size:11px">Regular</span></button>
        <button class="trafBtn" id="tbRed" onclick="setTraffic('red')" style="color:var(--red)">🔴<br><span style="font-size:11px">Problemas</span></button>
      </div>
    </div>
    <div class="field"><label>Comentario</label><textarea class="input" id="rvComment" placeholder="¿Qué pasó? Sé específico para ayudar al equipo..."></textarea></div>
    <button class="btn btn-primary btn-full" onclick="saveReview()">Publicar Reseña</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDuYbABd1Bj3jH9nDGkgwJ4iGNd_t8BYnc",
  authDomain: "agenda-barreta-102f1.firebaseapp.com",
  projectId: "agenda-barreta-102f1",
  storageBucket: "agenda-barreta-102f1.firebasestorage.app",
  messagingSenderId: "171019640664",
  appId: "1:171019640664:web:85fc1faded71c5a6902e43",
  measurementId: "G-3FC4QNK92M"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// ── STATE ──────────────────────────────────────────────────────────
window._events = [];
window._contacts = [];
window._reviews = [];
window._contactFilter = "all";
window._editingEventId = null;
window._editingContactId = null;
window._coRating = 3;
window._rvTraffic = "green";

const TYPE_LABELS = { band:"Banda", provider:"Proveedor", venue:"Local/Bar" };
const TRAFFIC = {
  green:{ color:"#22c55e", label:"Todo OK", emoji:"🟢" },
  yellow:{ color:"#eab308", label:"Regular", emoji:"🟡" },
  red:{ color:"#ef4444", label:"Problemas", emoji:"🔴" }
};

// ── HELPERS ────────────────────────────────────────────────────────
function fmt(d){ return new Date(d+"T12:00:00").toLocaleDateString("es-AR",{day:"2-digit",month:"short",year:"numeric"}); }
function uid(){ return Math.random().toString(36).slice(2,9); }
function badge(cls,txt){ return `<span class="badge ${cls}">${txt}</span>`; }
function trafficBadge(v){ const t=TRAFFIC[v]; return `<span class="badge badge-${v}">${t.emoji} ${t.label}</span>`; }
function starsHtml(val,interactive=false,prefix=""){ 
  return [1,2,3,4,5].map(i=>`<span class="star ${i<=val?'on':'off'}" ${interactive?`onclick="window.setCoRating(${i})"`:""} data-prefix="${prefix}">${'★'}</span>`).join("");
}

// ── TABS ───────────────────────────────────────────────────────────
window.setTab = function(i){
  document.querySelectorAll('.tab').forEach((t,j)=>t.classList.toggle('active',i===j));
  document.querySelectorAll('.screen').forEach((s,j)=>{
    s.style.display = i===j ? 'block' : 'none';
    s.classList.toggle('active',i===j);
  });
};

// ── MODALS ─────────────────────────────────────────────────────────
window.openModal = function(id){
  if(id==='modalReview') populateReviewSelect();
  if(id==='modalContact') initCoStars();
  document.getElementById(id).classList.add('open');
};
window.closeModal = function(id){ document.getElementById(id).classList.remove('open'); };
window.overlayClose = function(e,id){ if(e.target===e.currentTarget) closeModal(id); };

// ── CO STARS ──────────────────────────────────────────────────────
function initCoStars(){
  window._coRating=3;
  document.getElementById('coStarsInput').innerHTML=starsHtml(3,true);
}
window.setCoRating = function(v){
  window._coRating=v;
  document.getElementById('coStarsInput').innerHTML=starsHtml(v,true);
};

// ── TRAFFIC ───────────────────────────────────────────────────────
window.setTraffic = function(v){
  window._rvTraffic=v;
  ['green','yellow','red'].forEach(k=>{
    const btn=document.getElementById('tb'+k.charAt(0).toUpperCase()+k.slice(1));
    const t=TRAFFIC[k];
    btn.style.background= k===v ? t.color+'22' : 'var(--bg3)';
    btn.style.borderColor= k===v ? t.color : 'var(--border)';
  });
};
setTraffic('green');

// ── FILTER ────────────────────────────────────────────────────────
window.setFilter = function(el,val){
  window._contactFilter=val;
  document.querySelectorAll('.fbtn').forEach(b=>b.classList.toggle('active',b.dataset.filter===val));
  renderContacts();
};

// ── FIRESTORE LISTENERS ───────────────────────────────────────────
onSnapshot(query(collection(db,'events')), snap=>{
  window._events=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderEvents();
});
onSnapshot(query(collection(db,'contacts')), snap=>{
  window._contacts=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderContacts();
});
onSnapshot(query(collection(db,'reviews')), snap=>{
  window._reviews=snap.docs.map(d=>({id:d.id,...d.data()}));
  renderReviews();
  updateSemaStats();
});

document.getElementById('loadingMsg').style.display='none';
document.getElementById('screen0').style.display='block';
document.getElementById('screen0').classList.add('active');
document.getElementById('screen1').style.display='none';
document.getElementById('screen2').style.display='none';

// ── RENDER EVENTS ─────────────────────────────────────────────────
window.renderEvents = function(){
  const today=new Date().toISOString().slice(0,10);
  const upcoming=window._events.filter(e=>e.date>=today).sort((a,b)=>a.date.localeCompare(b.date));
  const past=window._events.filter(e=>e.date<today).sort((a,b)=>b.date.localeCompare(a.date));

  document.getElementById('eventsUpcoming').innerHTML = upcoming.length===0
    ? '<div class="empty">Sin eventos próximos</div>'
    : upcoming.map(ev=>eventCardHtml(ev)).join('');

  const pastLabel=document.getElementById('eventsPastLabel');
  pastLabel.style.display=past.length?'block':'none';
  document.getElementById('eventsPast').innerHTML=past.map(ev=>eventCardHtml(ev)).join('');
};

function eventCardHtml(ev){
  const cls=ev.status==='confirmed'?'card-event-confirmed':'card-event-tentative';
  const badgeCls=ev.status==='confirmed'?'badge-confirmed':'badge-tentative';
  const badgeTxt=ev.status==='confirmed'?'✓ CONFIRMADO':'? TENTATIVO';
  return `<div class="card ${cls}">
    <div class="card-row">
      <div style="flex:1">
        <div class="card-title">${ev.title}</div>
        <div class="card-sub">📍 ${ev.venue||'—'} · ${fmt(ev.date)}${ev.time?' · '+ev.time:''}</div>
        ${ev.notes?`<div class="card-note">"${ev.notes}"</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px">
        <span class="badge ${badgeCls}">${badgeTxt}</span>
        <button class="del-btn" onclick="deleteEvent('${ev.id}')">✕</button>
      </div>
    </div>
  </div>`;
}

// ── SAVE EVENT ────────────────────────────────────────────────────
window.saveEvent = async function(){
  const title=document.getElementById('evTitle').value.trim();
  const date=document.getElementById('evDate').value;
  if(!title||!date) return alert('Completá al menos nombre y fecha.');
  const data={
    title, date,
    venue:document.getElementById('evVenue').value.trim(),
    time:document.getElementById('evTime').value,
    status:document.getElementById('evStatus').value,
    notes:document.getElementById('evNotes').value.trim()
  };
  if(window._editingEventId){
    await updateDoc(doc(db,'events',window._editingEventId),data);
    window._editingEventId=null;
  } else {
    await addDoc(collection(db,'events'),data);
  }
  ['evTitle','evVenue','evDate','evTime','evNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('evStatus').value='confirmed';
  closeModal('modalEvent');
};

window.deleteEvent = async function(id){
  if(!confirm('¿Eliminar este evento?')) return;
  await deleteDoc(doc(db,'events',id));
};

// ── RENDER CONTACTS ───────────────────────────────────────────────
window.renderContacts = function(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const f=window._contactFilter;
  const filtered=window._contacts.filter(c=>{
    const matchType=f==='all'||c.type===f;
    const matchQ=!q||c.name.toLowerCase().includes(q)||c.contact?.toLowerCase().includes(q)||c.tags?.some(t=>t.toLowerCase().includes(q));
    return matchType&&matchQ;
  });

  if(filtered.length===0){ document.getElementById('contactsList').innerHTML='<div class="empty">Sin resultados</div>'; return; }
  document.getElementById('contactsList').innerHTML=filtered.map(c=>{
    const lt=getLastTraffic(c.id);
    return `<div class="card card-contact" onclick="showContactDetail('${c.id}')">
      <div class="card-row">
        <div style="flex:1">
          <div class="contact-header-row">
            <span class="card-title">${c.name}</span>
            <span class="badge badge-type">${TYPE_LABELS[c.type]}</span>
            ${lt?trafficBadge(lt):''}
          </div>
          <div class="card-sub">👤 ${c.contact||'—'} · 📞 ${c.phone||'—'}</div>
          <div class="tags">${(c.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
        </div>
        <div class="stars">${starsHtml(c.rating||0)}</div>
      </div>
    </div>`;
  }).join('');
};

function getLastTraffic(id){
  const rs=window._reviews.filter(r=>r.contactId===id).sort((a,b)=>b.date.localeCompare(a.date));
  return rs[0]?.traffic||null;
}

// ── SAVE CONTACT ──────────────────────────────────────────────────
window.saveContact = async function(){
  const name=document.getElementById('coName').value.trim();
  if(!name) return alert('El nombre es obligatorio.');
  const tags=document.getElementById('coTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  const data={
    type:document.getElementById('coType').value,
    name,
    contact:document.getElementById('coContact').value.trim(),
    phone:document.getElementById('coPhone').value.trim(),
    social:document.getElementById('coSocial').value.trim(),
    tags,
    rating:window._coRating,
    notes:document.getElementById('coNotes').value.trim()
  };
  if(window._editingContactId){
    await updateDoc(doc(db,'contacts',window._editingContactId),data);
    window._editingContactId=null;
    document.getElementById('modalContactTitle').textContent='Nuevo Contacto';
  } else {
    await addDoc(collection(db,'contacts'),data);
  }
  ['coName','coContact','coPhone','coSocial','coTags','coNotes'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('coType').value='band';
  initCoStars();
  closeModal('modalContact');
};

window.deleteContact = async function(id){
  if(!confirm('¿Eliminar este contacto?')) return;
  await deleteDoc(doc(db,'contacts',id));
  closeModal('modalDetail');
};

window.editContact = function(id){
  const c=window._contacts.find(x=>x.id===id);
  if(!c) return;
  window._editingContactId=id;
  document.getElementById('modalContactTitle').textContent='Editar Contacto';
  document.getElementById('coType').value=c.type;
  document.getElementById('coName').value=c.name;
  document.getElementById('coContact').value=c.contact||'';
  document.getElementById('coPhone').value=c.phone||'';
  document.getElementById('coSocial').value=c.social||'';
  document.getElementById('coTags').value=(c.tags||[]).join(', ');
  document.getElementById('coNotes').value=c.notes||'';
  window._coRating=c.rating||3;
  document.getElementById('coStarsInput').innerHTML=starsHtml(window._coRating,true);
  closeModal('modalDetail');
  openModal('modalContact');
};

// ── CONTACT DETAIL ────────────────────────────────────────────────
window.showContactDetail = function(id){
  const c=window._contacts.find(x=>x.id===id);
  if(!c) return;
  const revs=window._reviews.filter(r=>r.contactId===id).sort((a,b)=>b.date.localeCompare(a.date));
  document.getElementById('modalDetailContent').innerHTML=`
    <div class="modal-header">
      <span class="modal-title">${c.name}</span>
      <button class="modal-close" onclick="closeModal('modalDetail')">×</button>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px">
      <span class="badge badge-type">${TYPE_LABELS[c.type]}</span>
      <div class="stars">${starsHtml(c.rating||0)}</div>
    </div>
    <div class="detail-row">👤 <b style="color:var(--text)">${c.contact||'—'}</b></div>
    <div class="detail-row">📞 <a href="tel:${c.phone}">${c.phone||'—'}</a></div>
    ${c.social?`<div class="detail-row">🌐 <span style="color:var(--accent2)">${c.social}</span></div>`:''}
    ${(c.tags||[]).length?`<div class="tags" style="margin:8px 0 12px">${c.tags.map(t=>`<span class="tag">${t}</span>`).join('')}</div>`:''}
    ${c.notes?`<div class="detail-note">"${c.notes}"</div>`:''}
    <div class="rev-header">Reseñas (${revs.length})</div>
    ${revs.length===0?'<div style="color:var(--dim);font-size:13px;margin-bottom:12px">Sin reseñas todavía</div>':''}
    ${revs.map(r=>`<div class="rev-card">
      <div class="rev-meta">${trafficBadge(r.traffic)}<span class="rev-author">${r.author} · ${fmt(r.date)}</span></div>
      <div style="color:var(--muted);font-size:13px">${r.comment}</div>
    </div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" onclick="editContact('${c.id}')">✏️ Editar</button>
      <button class="btn btn-danger" style="flex:1" onclick="deleteContact('${c.id}')">Eliminar</button>
    </div>
  `;
  openModal('modalDetail');
};

// ── REVIEWS ───────────────────────────────────────────────────────
function populateReviewSelect(){
  const sel=document.getElementById('rvContact');
  sel.innerHTML='<option value="">Seleccionar...</option>'+
    window._contacts.map(c=>`<option value="${c.id}">${c.name} (${TYPE_LABELS[c.type]})</option>`).join('');
}

window.renderReviews = function(){
  const sorted=[...window._reviews].sort((a,b)=>b.date.localeCompare(a.date));
  if(sorted.length===0){ document.getElementById('reviewsList').innerHTML='<div class="empty">Sin reseñas. ¡Sé el primero!</div>'; return; }
  document.getElementById('reviewsList').innerHTML=sorted.map(r=>{
    const c=window._contacts.find(x=>x.id===r.contactId);
    const t=TRAFFIC[r.traffic];
    return `<div class="card card-review" style="border-left-color:${t.color};border:1px solid ${t.color}33;border-left:3px solid ${t.color}">
      <div class="card-row" style="margin-bottom:8px">
        <div>
          <span class="card-title">${c?.name||'Contacto eliminado'}</span>
          ${c?`<span style="color:var(--dim);font-size:12px;margin-left:8px">${TYPE_LABELS[c.type]}</span>`:''}
        </div>
        <button class="del-btn" onclick="deleteReview('${r.id}')">✕</button>
      </div>
      <div style="margin-bottom:8px">${trafficBadge(r.traffic)}</div>
      <div style="color:var(--muted);font-size:14px;line-height:1.5">${r.comment}</div>
      <div style="color:var(--dim);font-size:12px;margin-top:6px">— ${r.author} · ${fmt(r.date)}</div>
    </div>`;
  }).join('');
};

window.updateSemaStats = function(){
  ['green','yellow','red'].forEach(k=>{
    const id='stat'+k.charAt(0).toUpperCase()+k.slice(1);
    document.getElementById(id).textContent=window._reviews.filter(r=>r.traffic===k).length;
  });
};

window.saveReview = async function(){
  const contactId=document.getElementById('rvContact').value;
  const author=document.getElementById('rvAuthor').value.trim();
  const comment=document.getElementById('rvComment').value.trim();
  if(!contactId||!author||!comment) return alert('Completá todos los campos.');
  await addDoc(collection(db,'reviews'),{
    contactId, author, comment,
    traffic:window._rvTraffic,
    date:new Date().toISOString().slice(0,10)
  });
  document.getElementById('rvContact').value='';
  document.getElementById('rvAuthor').value='';
  document.getElementById('rvComment').value='';
  setTraffic('green');
  closeModal('modalReview');
};

window.deleteReview = async function(id){
  if(!confirm('¿Eliminar esta reseña?')) return;
  await deleteDoc(doc(db,'reviews',id));
};

</script>
</body>
</html>
